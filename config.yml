# ImmortalWrt PVE Builder Configuration
# ========================================
# Every key here is consumed by scripts/utils.sh + scripts/build.sh and by the
# GitHub Actions workflows. Values that OpenWrt cannot actually honour are
# documented as such instead of being silently ignored.

# Source Configuration
source:
  repo: "https://github.com/immortalwrt/immortalwrt.git"
  branch: "openwrt-24.10"
  # Optional: pin an exact tag instead of tracking the branch
  # tag: "v24.10.0"

# Target Configuration
# IMPORTANT: OpenWrt x86 has board=x86 and subtarget=64, so build output lands
# in bin/targets/x86/64/ - NOT bin/targets/x86_64/generic/.
target:
  arch: "x86_64"       # display / package architecture
  board: "x86"         # target/linux/<board>
  subtarget: "64"      # target/linux/<board>/<subtarget>
  profile: "generic"   # device profile

# Kernel Configuration
kernel:
  # Informational: openwrt-24.10 ships Linux 6.6 for the x86 target
  # (see target/linux/x86/Makefile: KERNEL_PATCHVER:=6.6).
  # This value only affects version strings and the manifest, not the build.
  version: "6.6"
  # link-time optimisation: on / off  -> CONFIG_USE_LTO
  lto: "off"
  # OPTIONS, NOT APPLIED: OpenWrt x86 has no Kconfig symbol for -march /
  # -O2..-O3 tuning, so these are kept purely as documentation. To really tune
  # the CPU you have to patch include/target.mk (see docs/cpu-tuning.md).
  cpu_opt: "none"
  optimization: "default"

# Feature Switches
features:
  # VirtIO (PVE/KVM paravirtual devices)
  # The drivers are built into the x86/64 target kernel, so `enabled` is
  # reported in manifest.json; the sub-toggles below are consumed by
  # scripts/build.sh and translated into kmod package selections where an
  # OpenWrt symbol exists (net -> kmod-virtio-net, block -> kmod-virtio-blk,
  # ...). They also make the intent explicit for future kernel configs.
  virtio:
    enabled: true
    net: true
    block: true
    scsi: true
    balloon: true
    rng: true
    console: true
    input: true
    mmio: true

  # VirtIO-FS (mount PVE host shares in the guest)
  # Requires the in-tree kmod-fs-virtiofs from package/kernel/linux/modules/
  virtiofs:
    enabled: true
    fuse: true

  # 9P Filesystem (alternative host-guest sharing)
  p9fs:
    enabled: true

  # Network Features
  network:
    wireguard: true
    nftables: true
    iptables_nft: true
    bridge: true
    multi_wan: false

  # Side Router Features
  proxy:
    # mihomo is NOT in the official 24.10 feeds. Enable it only after adding a
    # feed that provides it to custom/feeds.conf.
    mihomo: false
    smartdns: true
    adguardhome: false

  # System Features
  system:
    docker: false
    luci: true
    luci_cn: true
    luci_theme: true

  # Performance Optimizations
  performance:
    bbr: true
    fq_codel: true
    cake: true
    irq_balance: true

# Package Lists
# Additional package selections are appended to config/packages.config.
packages:
  include:
    - "luci-app-statistics"
    - "luci-proto-wireguard"
    - "smartdns"
    - "luci-app-smartdns"
    - "irqbalance"
    - "htop"
    - "tcpdump"
  exclude:
    - "ppp"
    - "ppp-mod-pppoe"

# Release Configuration
release:
  # Keep only keys that are actually consumed:
  #   keep_releases -> cleanup.yml (prunes old releases + tags)
  #   changelog     -> release job body includes upstream change notes
  # (the former `enabled`, `upload` and `cleanup_artifacts` keys were dead
  #  configuration - publishing is controlled by the workflow trigger and
  #  artifact retention lives in build.yml / cleanup.yml.)
  keep_releases: 10
  changelog: true

# Build Configuration
build:
  # Parallel jobs (0 = nproc)
  jobs: 0
  # Hard per-attempt timeout in minutes. Must stay BELOW the GitHub job
  # budget (timeout-minutes: 360 in build.yml) minus ~20 minutes of
  # clone/feeds/setup overhead, otherwise the runner kills the job before
  # this timeout can produce a clean error + logs.
  timeout: 330
  retry: false
  max_retries: 1
  verbose: false

# Upstream sync
# The builder never rebases itself onto ImmortalWrt (the two repositories share
# no history). It only detects new upstream commits and triggers a build.
sync:
  enabled: true
  schedule: "0 2 * * *"
  auto_build: true

# Output Configuration
# Globs matched inside bin/targets/<board>/<subtarget>/.
output:
  firmware: "*combined*.img.gz"
  rootfs: "*rootfs*"
  kernel: "*kernel.bin"
  sha256sum: true
  manifest: true