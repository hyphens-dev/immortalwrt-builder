# ImmortalWrt PVE Builder Configuration
# ========================================
# Every key here is consumed by scripts/utils.sh + scripts/build.sh and by the
# GitHub Actions workflows. Values that OpenWrt cannot actually honour are
# documented as such instead of being silently ignored.

# Source Configuration
source:
  repo: "https://github.com/immortalwrt/immortalwrt.git"
  branch: "openwrt-24.10"
  # Optional: pin an exact tag or commit instead of tracking the branch
  # tag: "v24.10.0"
  # commit: "abc123def456"

# Target Configuration
# IMPORTANT: OpenWrt x86 has board=x86 and subtarget=64, so build output lands
# in bin/targets/x86/64/ - NOT bin/targets/x86_64/generic/.
target:
  arch: "x86_64"       # display / package architecture
  board: "x86"         # target/linux/<board>
  subtarget: "64"      # target/linux/<board>/<subtarget>
  profile: "generic"   # device profile

# Kernel Configuration
kernel:
  # Informational: openwrt-24.10 ships Linux 6.6 for the x86 target
  # (see target/linux/x86/Makefile: KERNEL_PATCHVER:=6.6).
  # This value only affects version strings and the manifest, not the build.
  version: "6.6"
  # link-time optimisation: on / off  -> CONFIG_USE_LTO
  lto: "off"
  # OPTIONS, NOT APPLIED: OpenWrt x86 has no Kconfig symbol for -march /
  # -O2..-O3 tuning, so these are kept purely as documentation. To really tune
  # the CPU you have to patch include/target.mk (see docs/cpu-tuning.md).
  cpu_opt: "none"
  optimization: "default"

# Feature Switches
features:
  # VirtIO (PVE/KVM paravirtual devices)
  # The drivers are built into the x86/64 target kernel, so these toggles are
  # informational only - there is nothing to select in .config.
  virtio:
    enabled: true
    net: true
    block: true
    scsi: true
    balloon: true
    rng: true
    console: true
    input: true
    mmio: true

  # VirtIO-FS (mount PVE host shares in the guest)
  # Requires the in-tree kmod-fs-virtiofs from package/kernel/linux/modules/
  virtiofs:
    enabled: true
    fuse: true

  # 9P Filesystem (alternative host-guest sharing)
  p9fs:
    enabled: true

  # Network Features
  network:
    wireguard: true
    nftables: true
    iptables_nft: true
    bridge: true
    multi_wan: false

  # Side Router Features
  proxy:
    # mihomo is NOT in the official 24.10 feeds. Enable it only after adding a
    # feed that provides it to custom/feeds.conf.
    mihomo: false
    smartdns: true
    adguardhome: false

  # System Features
  system:
    docker: false
    luci: true
    luci_cn: true
    luci_theme: true

  # Performance Optimizations
  performance:
    bbr: true
    fq_codel: true
    cake: true
    irq_balance: true

# Package Lists
# Additional package selections are appended to config/packages.config.
packages:
  include:
    - "luci-app-statistics"
    - "luci-proto-wireguard"
    - "smartdns"
    - "luci-app-smartdns"
    - "irqbalance"
    - "htop"
    - "tcpdump"
  exclude:
    - "ppp"
    - "ppp-mod-pppoe"

# Release Configuration
release:
  enabled: true
  keep_releases: 10
  cleanup_artifacts: true
  changelog: true
  upload: true

# Build Configuration
build:
  # Parallel jobs (0 = nproc)
  jobs: 0
  # Hard per-attempt timeout in minutes. A full x86_64 + LuCI build on a
  # 4-core GitHub runner regularly needs 3-4h.
  timeout: 350
  retry: false
  max_retries: 1
  verbose: false

# Upstream sync
# The builder never rebases itself onto ImmortalWrt (the two repositories share
# no history). It only detects new upstream commits and triggers a build.
sync:
  enabled: true
  schedule: "0 2 * * *"
  auto_build: true

# Output Configuration
# Globs matched inside bin/targets/<board>/<subtarget>/.
output:
  firmware: "*combined*.img.gz"
  rootfs: "*rootfs*"
  kernel: "*kernel.bin"
  sha256sum: true
  manifest: true