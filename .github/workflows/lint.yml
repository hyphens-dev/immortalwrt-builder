name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck all scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh custom/files/etc/rc.local \
            custom/files/etc/hotplug.d/iface/90-virtio-queues

  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # 不依赖第三方 action（reviewdog/action-actionlint 与 rhysd/actionlint
      # 在本仓库环境都拉取失败），直接下载官方 release 二进制并固定版本，
      # 保证可复现。
      - name: Install actionlint
        run: |
          set -euo pipefail
          VERSION="1.7.7"
          curl -sSLf -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
          actionlint --version

      - name: Run actionlint
        run: |
          set -euo pipefail
          actionlint -color .github/workflows/*.yml

  parser-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
