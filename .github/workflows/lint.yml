name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck all scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh custom/files/etc/rc.local \
            custom/files/etc/hotplug.d/iface/90-virtio-queues

  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # reviewdog/action-actionlint@v1 已基本停止维护，在部分 runner 上会因
      # 拉取 ghcr.io/reviewdog/action-actionlint 镜像失败而报错。改用官方
      # rhysd/actionlint，行为一致且更可靠。
      - name: actionlint
        uses: rhysd/actionlint@v1

  parser-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
