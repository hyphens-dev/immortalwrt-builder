name: Cleanup Workflow Runs and Artifacts

on:
  schedule:
    # Run weekly on Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (no actual deletion)'
        required: false
        default: 'false'
        type: boolean

env:
  KEEP_RELEASES: 30
  ARTIFACT_RETENTION_DAYS: 7

jobs:
  cleanup-workflow-runs:
    name: Cleanup Old Workflow Runs
    runs-on: ubuntu-24.04
    outputs:
      deleted_count: ${{ steps.cleanup.outputs.deleted_count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get workflow run retention policy
        id: retention
        run: |
          # Read keep_releases from config.yml if it exists
          if [ -f config.yml ]; then
            KEEP_RELEASES=$(grep -E '^\s*keep_releases:' config.yml | awk '{print $2}')
            if [ -n "$KEEP_RELEASES" ]; then
              echo "Using keep_releases from config.yml: $KEEP_RELEASES"
              echo "keep_releases=$KEEP_RELEASES" >> $GITHUB_OUTPUT
            else
              echo "Using default keep_releases: ${{ env.KEEP_RELEASES }}"
              echo "keep_releases=${{ env.KEEP_RELEASES }}" >> $GITHUB_OUTPUT
            fi
          else
            echo "Using default keep_releases: ${{ env.KEEP_RELEASES }}"
            echo "keep_releases=${{ env.KEEP_RELEASES }}" >> $GITHUB_OUTPUT
          fi

      - name: Delete old workflow runs
        id: cleanup
        env:
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          KEEP_RELEASES: ${{ steps.retention.outputs.keep_releases }}
        run: |
          # Determine dry run flag
          if [ "$DRY_RUN" = "true" ]; then
            echo "Running in DRY RUN mode - no deletions will be performed"
            DRY_FLAG="--dry-run"
          else
            DRY_FLAG=""
          fi

          # Get all workflow runs, excluding active runs
          # We keep the last N runs per workflow
          deleted=0
          
          # Get list of workflow run IDs (excluding active ones)
          # Active runs have status: queued, in_progress, waiting
          run_ids=$(gh run list --json id,databaseId,status,workflowName \
            --jq '.[] | select(.status != "queued" and .status != "in_progress" and .status != "waiting") | .databaseId' 2>/dev/null | \
            tail -n +$((KEEP_RELEASES + 1)))

          if [ -z "$run_ids" ]; then
            echo "No old workflow runs to delete"
            echo "deleted_count=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          for run_id in $run_ids; do
            if [ "$DRY_RUN" = "true" ]; then
              echo "Would delete workflow run: $run_id"
            else
              echo "Deleting workflow run: $run_id"
              gh run delete $run_id 2>/dev/null || true
            fi
            deleted=$((deleted + 1))
          done

          echo "Deleted $deleted workflow runs"
          echo "deleted_count=$deleted" >> $GITHUB_OUTPUT

  cleanup-artifacts:
    name: Cleanup Old Artifacts
    runs-on: ubuntu-24.04
    needs: cleanup-workflow-runs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete old artifacts
        uses: actions/delete-artifact@v4
        with:
          name: ''
          pattern: '*'
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          use-gh-cli: true

      - name: Report artifact cleanup
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Artifact cleanup (dry run): Would delete artifacts older than ${{ env.ARTIFACT_RETENTION_DAYS }} days"
          else
            echo "Artifact cleanup: Deleted artifacts older than ${{ env.ARTIFACT_RETENTION_DAYS }} days"
          fi

  cleanup-releases:
    name: Cleanup Old Releases
    runs-on: ubuntu-24.04
    needs: cleanup-workflow-runs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get release retention from config
        id: config
        run: |
          if [ -f config.yml ]; then
            KEEP_RELEASES=$(grep -E '^\s*keep_releases:' config.yml | awk '{print $2}')
            if [ -n "$KEEP_RELEASES" ]; then
              echo "keep_releases=$KEEP_RELEASES" >> $GITHUB_OUTPUT
            else
              echo "keep_releases=${{ env.KEEP_RELEASES }}" >> $GITHUB_OUTPUT
            fi
          else
            echo "keep_releases=${{ env.KEEP_RELEASES }}" >> $GITHUB_OUTPUT
          fi

      - name: Delete old releases
        env:
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          KEEP_RELEASES: ${{ steps.config.outputs.keep_releases }}
        run: |
          # Determine dry run mode
          if [ "$DRY_RUN" = "true" ]; then
            echo "Running in DRY RUN mode - no deletions will be performed"
          fi

          # Get all releases sorted by created date (newest first)
          # We skip the first KEEP_RELEASES (latest releases)
          releases_to_delete=$(gh release list --json tagName,isDraft,isPrerelease,createdAt \
            --jq '[.[] | select(.isDraft == false and .isPrerelease == false)] | 
                 sort_by(.createdAt) | reverse | 
                 .['${KEEP_RELEASES}':] | .[].tagName' 2>/dev/null)

          if [ -z "$releases_to_delete" ]; then
            echo "No old releases to delete (keeping latest $KEEP_RELEASES)"
            exit 0
          fi

          deleted=0
          for tag in $releases_to_delete; do
            if [ "$DRY_RUN" = "true" ]; then
              echo "Would delete release: $tag"
            else
              echo "Deleting release: $tag"
              gh release delete "$tag" --yes 2>/dev/null || true
            fi
            deleted=$((deleted + 1))
          done

          echo "Deleted $deleted old releases (kept latest $KEEP_RELEASES)"

  summary:
    name: Cleanup Summary
    runs-on: ubuntu-24.04
    needs: [cleanup-workflow-runs, cleanup-artifacts, cleanup-releases]
    if: always()
    steps:
      - name: Print Cleanup Summary
        run: |
          echo "## Cleanup Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Task | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Workflow Runs | ${needs.cleanup-workflow-runs.outputs.deleted_count:-0} deleted |" >> $GITHUB_STEP_SUMMARY
          echo "| Artifacts | Older than ${{ env.ARTIFACT_RETENTION_DAYS }} days cleaned |" >> $GITHUB_STEP_SUMMARY
          echo "| Releases | Kept latest ${{ env.KEEP_RELEASES }} releases |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "**Dry run mode** - no actual deletions performed" >> $GITHUB_STEP_SUMMARY
          fi