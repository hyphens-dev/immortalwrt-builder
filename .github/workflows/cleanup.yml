name: Cleanup Workflow Runs and Artifacts

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (report only, delete nothing)'
        required: false
        default: true
        type: boolean

env:
  DEFAULT_KEEP_RELEASES: 10
  DEFAULT_KEEP_RUNS: 30
  ARTIFACT_RETENTION_DAYS: 7

permissions:
  contents: write
  actions: write

jobs:
  read-config:
    name: Read retention config
    runs-on: ubuntu-24.04
    outputs:
      keep_releases: ${{ steps.cfg.outputs.keep_releases }}
      keep_runs: ${{ steps.cfg.outputs.keep_runs }}
    steps:
      - uses: actions/checkout@v4
      - id: cfg
        run: |
          set -euo pipefail
          KEEP_RELEASES="$(grep -E '^[[:space:]]+keep_releases:' config.yml | head -1 | awk '{print $2}')"
          [ -n "${KEEP_RELEASES:-}" ] || KEEP_RELEASES="${DEFAULT_KEEP_RELEASES}"
          echo "keep_releases=${KEEP_RELEASES}" >> "$GITHUB_OUTPUT"
          echo "keep_runs=${DEFAULT_KEEP_RUNS}" >> "$GITHUB_OUTPUT"

  cleanup-runs:
    name: Delete old workflow runs
    needs: read-config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Delete old runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          KEEP: ${{ needs.read-config.outputs.keep_runs }}
          DRY_RUN: ${{ inputs.dry_run || 'true' }}
        run: |
          set -euo pipefail

          # gh paginates; --limit 500 avoids only ever seeing the first page
          mapfile -t RUN_IDS < <(
            gh run list --limit 500 --json databaseId,status \
              --jq '.[] | select(.status == "completed") | .databaseId'
          )

          echo "Completed runs found: ${#RUN_IDS[@]} (keeping newest ${KEEP})"

          if [ "${#RUN_IDS[@]}" -le "${KEEP}" ]; then
            echo "Nothing to delete."
            exit 0
          fi

          deleted=0
          for id in "${RUN_IDS[@]:$KEEP}"; do
            if [ "${DRY_RUN}" = "true" ]; then
              echo "[dry-run] would delete run ${id}"
            else
              gh run delete "$id" && echo "deleted run ${id}"
            fi
            deleted=$((deleted + 1))
          done

          echo "### Workflow runs" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${deleted} run(s) ${DRY_RUN:+processed}$([ "${DRY_RUN}" = "true" ] && echo ' (dry run)')." >> "$GITHUB_STEP_SUMMARY"

  cleanup-artifacts:
    name: Delete old artifacts
    needs: read-config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Delete expired artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run || 'true' }}
          DAYS: ${{ env.ARTIFACT_RETENTION_DAYS }}
        run: |
          set -euo pipefail

          # GitHub already expires artifacts via retention-days; this catches
          # anything left behind by older runs.
          CUTOFF="$(date -u -d "${DAYS} days ago" +%s)"

          mapfile -t EXPIRED < <(
            gh api --paginate "repos/${GH_REPO}/actions/artifacts?per_page=100" \
              --jq ".artifacts[] | select((.created_at | fromdate) < ${CUTOFF}) | .id"
          )

          echo "Expired artifacts: ${#EXPIRED[@]}"

          deleted=0
          for id in "${EXPIRED[@]}"; do
            if [ "${DRY_RUN}" = "true" ]; then
              echo "[dry-run] would delete artifact ${id}"
            else
              gh api -X DELETE "repos/${GH_REPO}/actions/artifacts/${id}" \
                && echo "deleted artifact ${id}"
            fi
            deleted=$((deleted + 1))
          done

          echo "### Artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${deleted} artifact(s) older than ${DAYS} days processed." >> "$GITHUB_STEP_SUMMARY"

  cleanup-releases:
    name: Delete old releases
    needs: read-config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete old releases and tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          KEEP: ${{ needs.read-config.outputs.keep_releases }}
          DRY_RUN: ${{ inputs.dry_run || 'true' }}
        run: |
          set -euo pipefail

          # Newest first, skip the newest KEEP entries
          mapfile -t TAGS < <(
            gh release list --limit 200 --json tagName,createdAt,isDraft,isPrerelease \
              --jq '[.[] | select(.isDraft == false)] | sort_by(.createdAt) | reverse | .[] | .tagName'
          )

          echo "Releases found: ${#TAGS[@]} (keeping newest ${KEEP})"

          if [ "${#TAGS[@]}" -le "${KEEP}" ]; then
            echo "Nothing to delete."
            exit 0
          fi

          deleted=0
          for tag in "${TAGS[@]:$KEEP}"; do
            if [ "${DRY_RUN}" = "true" ]; then
              echo "[dry-run] would delete release ${tag}"
            else
              gh release delete "$tag" --yes --cleanup-tag && echo "deleted release ${tag}"
            fi
            deleted=$((deleted + 1))
          done

          echo "### Releases" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${deleted} release(s) processed (tags removed too)." >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: Cleanup Summary
    needs: [cleanup-runs, cleanup-artifacts, cleanup-releases]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: |
          {
            echo "## Cleanup Summary"
            echo ""
            echo "| Task | Result |"
            echo "|------|--------|"
            echo "| Workflow runs | \`${{ needs.cleanup-runs.result }}\` |"
            echo "| Artifacts | \`${{ needs.cleanup-artifacts.result }}\` |"
            echo "| Releases | \`${{ needs.cleanup-releases.result }}\` |"
            echo "| Dry run | \`${{ inputs.dry_run || 'true' }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"