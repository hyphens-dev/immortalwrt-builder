name: Sync Upstream

# This workflow only DETECTS new ImmortalWrt commits and triggers a build.
#
# It deliberately does NOT rebase/merge this repository onto ImmortalWrt:
# the two repositories share no history, so a rebase would drag the entire
# multi-gigabyte firmware source tree into this repo. Every build clones the
# upstream tree fresh (see build.yml), which is the correct model.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Trigger a build even if upstream has no new commits'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

jobs:
  check-upstream:
    name: Check for upstream updates
    runs-on: ubuntu-24.04
    outputs:
      has_updates: ${{ steps.check.outputs.has_updates }}
      upstream_commit: ${{ steps.check.outputs.upstream_commit }}
      upstream_ref: ${{ steps.check.outputs.upstream_ref }}
      repo: ${{ steps.check.outputs.repo }}
      auto_build: ${{ steps.check.outputs.auto_build }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve upstream and compare
        id: check
        run: |
          set -euo pipefail

          # Same rationale as in build.yml: the runner's pre-installed "yq"
          # may be the Python jq-wrapper instead of mikefarah's Go tool, in
          # which case `.source.repo` is parsed as a jq filter and fails.
          # Use the pinned Node parser (scripts/yq-compatible.mjs) instead.
          node --version
          npm ci --no-audit --no-fund
          cfg() { node scripts/yq-compatible.mjs "$1" config.yml | tr -d '\r'; }

          REPO="$(cfg '.source.repo')"
          BRANCH="$(cfg '.source.branch')"
          TAG="$(cfg '.source.tag')"
          AUTO_BUILD="$(cfg '.sync.auto_build')"

          [ -n "$REPO" ] || REPO="https://github.com/immortalwrt/immortalwrt.git"
          [ -n "$BRANCH" ] || BRANCH="openwrt-24.10"
          [ -n "$AUTO_BUILD" ] || AUTO_BUILD="false"

          REF="${TAG:-$BRANCH}"

          # Resolve the upstream ref to a commit with a shallow ls-remote - this
          # is cheap and needs no clone.
          UPSTREAM_COMMIT="$(git ls-remote "$REPO" "refs/heads/$REF" "refs/tags/$REF^{}" "refs/tags/$REF" \
                              | head -1 | cut -f1)"
          if [ -z "$UPSTREAM_COMMIT" ]; then
            echo "::error::Could not resolve ${REPO} ref '${REF}'"
            exit 1
          fi

          # The last commit this repo successfully built is recorded in the
          # build record file (written by the previous successful run).
          LAST_BUILT=""
          if [ -f .upstream-built ]; then
            LAST_BUILT="$(tr -d '[:space:]' < .upstream-built)"
          fi

          echo "Upstream ref : ${REF}"
          echo "Upstream head: ${UPSTREAM_COMMIT}"
          echo "Last built   : ${LAST_BUILT:-<none>}"

          {
            echo "repo=${REPO}"
            echo "upstream_commit=${UPSTREAM_COMMIT}"
            echo "upstream_ref=${REF}"
            echo "auto_build=${AUTO_BUILD}"
          } >> "$GITHUB_OUTPUT"

          if [ "${UPSTREAM_COMMIT}" = "${LAST_BUILT}" ]; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            echo "No new upstream commits."
          else
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            echo "New upstream commits detected."
          fi

          {
            echo "### Upstream check"
            echo ""
            echo "| Key | Value |"
            echo "|-----|-------|"
            echo "| Ref | \`${REF}\` |"
            echo "| Upstream HEAD | \`${UPSTREAM_COMMIT}\` |"
            echo "| Last built | \`${LAST_BUILT:-none}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  trigger-build:
    name: Trigger build
    needs: check-upstream
    if: |
      always() &&
      needs.check-upstream.result == 'success' &&
      (needs.check-upstream.outputs.has_updates == 'true' ||
       inputs.force_build == true) &&
      (needs.check-upstream.outputs.auto_build == 'true' || inputs.force_build == true)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # GITHUB_TOKEN-created repository_dispatch events do NOT start workflows
      # (GitHub suppresses that to avoid recursion). workflow_dispatch via the
      # API does work with `actions: write`.
      - name: Dispatch build workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # checkout is needed for config.yml + the Node parser helper
          node --version
          npm ci --no-audit --no-fund
          SOURCE_BRANCH="$(node scripts/yq-compatible.mjs '.source.branch' config.yml | tr -d '\r')"
          [ -n "$SOURCE_BRANCH" ] || SOURCE_BRANCH="openwrt-24.10"
          gh workflow run build.yml \
            --ref "${{ github.ref_name }}" \
            -f source_branch="${SOURCE_BRANCH}" \
            -f create_release=true || {
              echo "::warning::Could not dispatch via gh; falling back to repository_dispatch"
              curl -sS -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GH_REPO}/dispatches" \
                -d '{"event_type":"upstream-sync"}'
            }
          echo "Build workflow dispatched." >> "$GITHUB_STEP_SUMMARY"

      - name: Record note
        run: |
          {
            echo "### Build triggered"
            echo ""
            echo "Upstream commit: \`${{ needs.check-upstream.outputs.upstream_commit }}\`"
            echo ""
            echo "> \`.upstream-built\` is updated by the build workflow after a"
            echo "> successful build, so the next run will not rebuild the same commit."
          } >> "$GITHUB_STEP_SUMMARY"