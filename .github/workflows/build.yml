name: Build ImmortalWrt PVE

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'config.yml 中 source.branch 的临时覆盖（留空则用配置文件）'
        required: false
        default: ''
  repository_dispatch:
    types: [upstream-update]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  config:
    runs-on: ubuntu-24.04
    outputs:
      branch: ${{ steps.read.outputs.branch }}
      repo: ${{ steps.read.outputs.repo }}
      cache-key: ${{ steps.read.outputs.cache-key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # 注意：runner 上有两个互不相关的 `yq`，本仓库一律使用
      # scripts/yq-compatible.mjs 解析 config.yml。
      - name: Read config.yml
        id: read
        run: |
          BRANCH="$(node scripts/yq-compatible.mjs source.branch)"
          if [ -n "${{ inputs.target_branch }}" ]; then
            BRANCH="${{ inputs.target_branch }}"
          fi
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "repo=$(node scripts/yq-compatible.mjs source.repo)" >> "$GITHUB_OUTPUT"
          echo "cache-key=iwrt-dl-${BRANCH}-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

  build:
    needs: config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc gcc-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils \
            rsync swig unzip zlib1g-dev file wget ccache qemu-utils \
            libelf-dev ack time

      - name: Cache downloads + ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/openwrt/dl
            ~/openwrt/.ccache
          key: ${{ needs.config.outputs.cache-key }}
          restore-keys: |
            iwrt-dl-${{ needs.config.outputs.branch }}-

      - name: Clone upstream (pinned branch)
        working-directory: ${{ github.workspace }}
        run: |
          git clone --depth=1 --branch "${{ needs.config.outputs.branch }}" \
            "${{ needs.config.outputs.repo }}" "${HOME}/openwrt"

      - name: Build firmware
        env:
          SRC_DIR: ${{ github.workspace }}/openwrt
        run: |
          mv "${HOME}/openwrt" "${SRC_DIR}"
          export SKIP_CLONE=1
          bash scripts/build.sh

      - name: Record built upstream commit (artifact, never pushed to main)
        run: |
          git -C openwrt rev-parse HEAD > upstream-built-marker
          cat upstream-built-marker

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-pve-x86-64
          path: |
            dist/*.img.gz
            dist/*.manifest
            dist/config.buildinfo
            dist/manifest.json
            upstream-built-marker
          if-no-files-found: error

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          tag_name: pve-build-${{ github.run_number }}
          name: ImmortalWrt PVE build ${{ github.run_number }}
          files: |
            dist/*.img.gz
            dist/manifest.json
          make_prerelease: true
