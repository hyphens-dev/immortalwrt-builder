name: Build ImmortalWrt PVE

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'config.yml 中 source.branch 的临时覆盖（留空则用配置文件）'
        required: false
        default: ''
  repository_dispatch:
    types: [upstream-update]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  config:
    runs-on: ubuntu-24.04
    outputs:
      branch: ${{ steps.read.outputs.branch }}
      repo: ${{ steps.read.outputs.repo }}
      cache-key: ${{ steps.read.outputs.cache-key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 最低要求 Node 18：scripts/yq-compatible.mjs 使用了 `node:` 前缀的
          # 内置模块导入（Node >=14.18/16）与较新的 V8 特性，老镜像自带的
          # Node 12/14 会直接报 "Cannot find module 'node:fs'" / SyntaxError。
          # 统一用 setup-node 显式安装，避免依赖 runner 镜像里过旧的预装版本。
          node-version: '20'
      # 注意：runner 上有两个互不相关的 `yq`，本仓库一律使用
      # scripts/yq-compatible.mjs 解析 config.yml。
      - name: Read config.yml
        id: read
        run: |
          BRANCH="$(node scripts/yq-compatible.mjs source.branch)"
          if [ -n "${{ inputs.target_branch }}" ]; then
            BRANCH="${{ inputs.target_branch }}"
          fi
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "repo=$(node scripts/yq-compatible.mjs source.repo)" >> "$GITHUB_OUTPUT"
          echo "cache-key=iwrt-dl-${BRANCH}-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

  build:
    needs: config
    runs-on: ubuntu-24.04
    # 失败/噪音构建不再无限烧到 GitHub 的 6 小时硬限时；正常全量构建约 1.5-2.5h
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4

      # runner 根分区只有 ~14GB，OpenWrt 全量构建的 staging_dir/build_dir 会
      # 吃掉绝大部分空间。先删掉构建用不到的预装工具链（Android SDK、.NET、
      # PowerShell、hostedtoolcache/Ruby 等），通常可释放 5-8GB。
      # 必须放在 setup-node / apt install 之前：setup-node 会把 Node 写进
      # hostedtoolcache，先清理就不会误删本次要用的版本。
      - name: Free up disk space (remove unused toolchains)
        run: bash scripts/clean-runner.sh

      - name: Disk usage report
        run: df -h /

      - name: Install build dependencies
        run: |
          # 兼容非 ubuntu-24.04 的 runner（如误用旧镜像 / 自托管机器）：
          # python3-distutils 在 Debian 12 / Ubuntu 23.04+（Python 3.12 移除了
          # distutils）已被 obsoleted，apt 会报
          #   "Package 'python3-distutils' has no installation candidate"
          # 因此先探测候选版本是否存在，不存在则退回 python3-setuptools
          # （ImmortalWrt/OpenWrt 官方构建依赖列表在新发行版上的等价替代）。
          sudo apt-get update
          DEPS="build-essential clang flex bison g++ gawk gcc gcc-multilib \
            gettext git libncurses5-dev libssl-dev \
            rsync swig unzip zlib1g-dev file wget ccache qemu-utils \
            libelf-dev ack time"
          if [ -n "$(apt-cache policy python3-distutils | awk '/Candidate:/ && $2 != "(none)" {print $2}')" ]; then
            DEPS="$DEPS python3-distutils"
          else
            echo "python3-distutils 在当前发行版已不可用（Python>=3.12），改用 python3-setuptools"
            DEPS="$DEPS python3-setuptools"
          fi
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $DEPS

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 同 config job：显式安装 Node 20，不依赖 runner 镜像自带的旧版本
          node-version: '20'

      - name: Check Node.js version
        run: |
          # scripts/yq-compatible.mjs 需要 Node >= 18（`node:` 前缀内置模块导入）。
          # 若系统/runner 预装的 node 过老（常见于 Debian 11/Ubuntu 20.04 自带的
          # Node 10/12，会报 Cannot find module 'node:fs'），显式报错并给出提示，
          # 而不是在后面每个 `node scripts/...` 步骤里以难懂的堆栈失败。
          MAJOR_RAW="$(node -p 'process.versions.node.split(".")[0]' 2>/dev/null || echo 0)"
          MAJOR="${MAJOR_RAW#v}"
          case "$MAJOR" in ''|*[!0-9]*) MAJOR=0 ;; esac
          if [ "${MAJOR}" -lt 18 ]; then
            echo "::error::Node ${MAJOR} 过老，本仓库脚本需要 Node >= 18。请在 workflow 中加入 actions/setup-node@v4 (node-version: '20')，或在本地安装新版 Node（https://nodejs.org）。"
            exit 1
          fi
          echo "Node $(node --version) OK"

      - name: Cache downloads + ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/openwrt/dl
            ~/openwrt/.ccache
          key: ${{ needs.config.outputs.cache-key }}
          restore-keys: |
            iwrt-dl-${{ needs.config.outputs.branch }}-

      - name: Clone upstream (pinned branch)
        working-directory: ${{ github.workspace }}
        run: |
          git clone --depth=1 --branch "${{ needs.config.outputs.branch }}" \
            "${{ needs.config.outputs.repo }}" "${HOME}/openwrt"

      - name: Build firmware
        env:
          SRC_DIR: ${{ github.workspace }}/openwrt
        run: |
          mv "${HOME}/openwrt" "${SRC_DIR}"
          export SKIP_CLONE=1
          bash scripts/build.sh

      - name: Record built upstream commit (artifact, never pushed to main)
        run: |
          git -C openwrt rev-parse HEAD > upstream-built-marker
          cat upstream-built-marker

      - name: Copy sha256sums to dist (参考 luyanci ci.yml L184-L199)
        run: |
          # 产物目录 bin/targets/<board>/<subtarget>/ 里有 sha256sums，
          # 一并拷进 dist/ 供后续 Release 步骤引用。
          TARGET_DIR="openwrt/bin/targets/$(node scripts/yq-compatible.mjs target.board)/$(node scripts/yq-compatible.mjs target.subtarget)"
          if [ -f "${TARGET_DIR}/sha256sums" ]; then
            cp "${TARGET_DIR}/sha256sums" dist/sha256sums
          else
            echo "::warning::未找到 ${TARGET_DIR}/sha256sums，Release 正文将缺少校验和"
            : > dist/sha256sums
          fi

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-pve-x86-64
          path: |
            dist/*.img.gz
            dist/*.manifest
            dist/config.buildinfo
            dist/sha256sums
            dist/manifest.json
            upstream-built-marker
          if-no-files-found: error

  release:
    needs: [config, build]
    runs-on: ubuntu-24.04
    # 参考 https://github.com/luyanci/immortalwrt-ax3000 ci.yml 的 release job：
    # 从 artifacts 下载产物 -> 生成 Release.md（构建时间/Sources/SHA256）
    # -> 用 softprops/action-gh-release 发布 prerelease。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download firmware from artifacts
        uses: actions/download-artifact@v4
        with:
          name: immortalwrt-pve-x86-64
          path: dist

      - name: Generate release informations
        run: |
          TIME="$(curl "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" | jq -r .created_at)"

          TAG="pve-build-$(date -d "${TIME}" -u +'%Y%m%d-%H%M%S')-${GITHUB_SHA:0:8}"
          echo "TAG=$TAG" >>"$GITHUB_ENV"

          cat <<EOF | sed -E 's/^  //' >Release.md
            ImmortalWrt PVE $(date -d "${TIME}" -u +'%Y-%m-%d %H:%M:%S %Z(%:z)')

            # ${{ needs.config.outputs.branch }}

            Build time: \`$(date -d "${TIME}" -u +'%Y-%m-%d %H:%M:%S %Z(%:z)')\`
            Release version: ${TAG}
            Upstream commit: \`$(cat dist/upstream-built-marker 2>/dev/null || echo unknown)\`

            ## SHA256
            $(awk '{gsub(/^\*/,""); printf "%s: `%s`\n", $2, $1}' dist/sha256sums 2>/dev/null)
          EOF

          echo "NAME=$(head --line=1 Release.md)" >>"$GITHUB_ENV"
          tail --line=+2 Release.md >Body.md

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.NAME }}
          body_path: Body.md
          files: |
            dist/sha256sums
            dist/*.img.gz
            dist/*.manifest
            dist/manifest.json
