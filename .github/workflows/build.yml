name: Build ImmortalWrt PVE Firmware

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'ImmortalWrt source repository URL'
        required: false
        default: ''
      source_branch:
        description: 'ImmortalWrt source branch'
        required: false
        default: ''
      source_tag:
        description: 'ImmortalWrt source tag (overrides branch)'
        required: false
        default: ''
      clean_build:
        description: 'Perform clean build (ignore caches)'
        required: false
        default: false
        type: boolean
      verbose:
        description: 'Enable verbose build output (V=s)'
        required: false
        default: false
        type: boolean
      create_release:
        description: 'Create a GitHub release from this build'
        required: false
        default: true
        type: boolean
  repository_dispatch:
    types: [upstream-sync]
  workflow_call:
    inputs:
      source_repo:
        required: false
        default: ''
        type: string
      source_branch:
        required: false
        default: ''
        type: string
      source_tag:
        required: false
        default: ''
        type: string
      clean_build:
        required: false
        default: false
        type: boolean
      verbose:
        required: false
        default: false
        type: boolean
      create_release:
        required: false
        default: false
        type: boolean
    outputs:
      artifact_name:
        description: 'Name of the uploaded firmware artifact'
        value: ${{ jobs.build.outputs.artifact_name }}
      build_result:
        description: 'outcome of the build step'
        value: ${{ jobs.build.outputs.build_result }}

# All workflow inputs are passed through `env`, never interpolated directly into
# a shell script (prevents command injection via workflow_dispatch inputs).
env:
  INPUT_SOURCE_REPO: ${{ inputs.source_repo || '' }}
  INPUT_SOURCE_BRANCH: ${{ inputs.source_branch || '' }}
  INPUT_SOURCE_TAG: ${{ inputs.source_tag || '' }}
  INPUT_VERBOSE: ${{ inputs.verbose || false }}

  PROJECT_DIR: ${{ github.workspace }}
  SOURCE_DIR: ${{ github.workspace }}/openwrt
  OUTPUT_DIR: ${{ github.workspace }}/output

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────
  # Resolve configuration
  # ──────────────────────────────────────────────
  prepare:
    name: Resolve Configuration
    runs-on: ubuntu-24.04
    outputs:
      source_repo: ${{ steps.cfg.outputs.source_repo }}
      source_branch: ${{ steps.cfg.outputs.source_branch }}
      source_tag: ${{ steps.cfg.outputs.source_tag }}
      arch: ${{ steps.cfg.outputs.arch }}
      board: ${{ steps.cfg.outputs.board }}
      subtarget: ${{ steps.cfg.outputs.subtarget }}
      timeout: ${{ steps.cfg.outputs.timeout }}
      verbose: ${{ steps.cfg.outputs.verbose }}
    steps:
      - uses: actions/checkout@v4

      # Cache the npm cache directory itself (contents are content-addressed,
      # so a fixed key is safe and saves the download on every run).
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - name: Read config.yml
        id: cfg
        run: |
          set -euo pipefail

          # IMPORTANT: ubuntu-24.04 runners ship *two* unrelated tools named
          # "yq" (the Python jq-wrapper pre-installed via pip, and mikefarah's
          # Go binary bundled with snapd). Depending on PATH order, a query
          # like `yq '.source.repo'` may be interpreted as a jq filter against
          # JSON and fail silently - which previously produced empty build
          # configuration. Use the pinned Node parser instead (same one
          # scripts/build.sh uses), so there is exactly one YAML dialect.
          node --version
          npm ci --no-audit --no-fund

          # Prints nothing for absent keys (mikefarah-compatible subset).
          cfg() { node scripts/yq-compatible.mjs "$1" config.yml | tr -d '\r'; }

          SOURCE_REPO="${INPUT_SOURCE_REPO:-$(cfg '.source.repo')}"
          SOURCE_BRANCH="${INPUT_SOURCE_BRANCH:-$(cfg '.source.branch')}"
          SOURCE_TAG="${INPUT_SOURCE_TAG:-$(cfg '.source.tag')}"
          ARCH="$(cfg '.target.arch')"
          BOARD="$(cfg '.target.board')"
          SUBTARGET="$(cfg '.target.subtarget')"
          TIMEOUT="$(cfg '.build.timeout')"
          VERBOSE="$(cfg '.build.verbose')"
          [ -n "$VERBOSE" ] || VERBOSE="false"

          [ -n "$SOURCE_REPO" ] || SOURCE_REPO="https://github.com/immortalwrt/immortalwrt.git"
          [ -n "$SOURCE_BRANCH" ] || SOURCE_BRANCH="openwrt-24.10"
          [ -n "$ARCH" ] || ARCH="x86_64"
          [ -n "$BOARD" ] || BOARD="x86"
          [ -n "$SUBTARGET" ] || SUBTARGET="64"
          [ -n "$TIMEOUT" ] || TIMEOUT="350"

          if [ "${INPUT_VERBOSE:-false}" = "true" ]; then VERBOSE="true"; fi

          {
            echo "source_repo=$SOURCE_REPO"
            echo "source_branch=$SOURCE_BRANCH"
            echo "source_tag=$SOURCE_TAG"
            echo "arch=$ARCH"
            echo "board=$BOARD"
            echo "subtarget=$SUBTARGET"
            echo "timeout=$TIMEOUT"
            echo "verbose=$VERBOSE"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Build configuration"
            echo ""
            echo "| Key | Value |"
            echo "|-----|-------|"
            echo "| Source | \`$SOURCE_REPO\` |"
            echo "| Ref | \`${SOURCE_TAG:-$SOURCE_BRANCH}\` |"
            echo "| Target | \`$BOARD/$SUBTARGET\` (pkgarch \`$ARCH\`) |"
            echo "| Timeout | \`${TIMEOUT}m\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────
  # Build
  # ──────────────────────────────────────────────
  build:
    name: Build Firmware
    runs-on: ubuntu-24.04
    needs: prepare
    # GitHub allows at most 360 minutes per job; the script timeout is enforced
    # inside scripts/build.sh as well.
    timeout-minutes: 360
    permissions:
      contents: write
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
      build_result: ${{ steps.build_step.outcome }}
    env:
      SOURCE_REPO: ${{ needs.prepare.outputs.source_repo }}
      SOURCE_BRANCH: ${{ needs.prepare.outputs.source_branch }}
      SOURCE_TAG: ${{ needs.prepare.outputs.source_tag }}
      TARGET_ARCH: ${{ needs.prepare.outputs.arch }}
      TARGET_BOARD: ${{ needs.prepare.outputs.board }}
      TARGET_SUBTARGET: ${{ needs.prepare.outputs.subtarget }}
      BUILD_TIMEOUT: ${{ needs.prepare.outputs.timeout }}
      BUILD_VERBOSE: ${{ needs.prepare.outputs.verbose }}

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      # Share the npm cache with the prepare job so `npm ci` in scripts and
      # any future node tooling never re-downloads packages.
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - name: Free disk space
        run: |
          # An x86_64 + LuCI build needs ~25-30 GB; the runner only has ~14 GB
          # free by default. Strip toolchains we do not use.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get -qq clean
          df -h /

      # ── Build dependencies (verified against ubuntu-24.04 / noble) ──
      # Verified against include/prereq-build.mk of openwrt-24.10:
      #   * python3-distutils does NOT exist on noble; the prereq test is
      #     skipped for python >= 3.12, so it is not needed at all.
      #   * libncurses5-dev does NOT exist; prereq only needs ncurses.h
      #     -> libncurses-dev.
      #   * ecj / java-propose-classpath live in universe and are not part of
      #     prereq-build.mk; default-jdk (main) covers any java package builds.
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools python3-dev python3-pyelftools \
            rsync swig unzip zlib1g-dev file wget xsltproc subversion \
            patch curl time jq which bzip2 perl \
            default-jdk

      - name: Verify host prerequisites
        run: |
          set -euo pipefail
          missing=0
          for c in gcc g++ make awk bash bzip2 cp diff file find gawk grep \
                   gzip install patch perl python3 realpath rsync seq stat tar \
                   unzip wget which xargs git; do
            if ! command -v "$c" >/dev/null 2>&1; then
              echo "::error::missing host command: $c"
              missing=1
            fi
          done
          printf '#include <ncurses.h>\nint main(void){initscr();return 0;}\n' > /tmp/nc.c
          gcc /tmp/nc.c -o /tmp/nc -lncurses || { echo '::error::ncurses dev missing'; missing=1; }
          python3 -c 'import sys; print("python", sys.version)'
          [ "$missing" -eq 0 ] || exit 1
          echo "All host prerequisites satisfied."

      - name: Restore downloads cache
        if: ${{ inputs.clean_build != true }}
        uses: actions/cache@v4
        with:
          path: ${{ env.SOURCE_DIR }}/dl
          key: dl-${{ needs.prepare.outputs.arch }}-${{ hashFiles('config.yml', 'config/*.config') }}
          restore-keys: |
            dl-${{ needs.prepare.outputs.arch }}-

      # ── Toolchain reuse ──────────────────────────────────────────────
      # ccache turns a rebuild of the same upstream commit from ~3h into
      # well under 1h; the OpenWrt staging_dir tree itself is far larger
      # than the 10 GB per-cache limit, so we persist only:
      #   * ~/.ccache  (compiler cache, keyed by target + restore-keys prefix)
      #   * dl/        (source downloads, cached above)
      - name: Install ccache
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends ccache
          ccache --version | head -1

      - name: Restore ccache
        if: ${{ inputs.clean_build != true }}
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ needs.prepare.outputs.board }}-${{ needs.prepare.outputs.subtarget }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ needs.prepare.outputs.board }}-${{ needs.prepare.outputs.subtarget }}-

      - name: Configure ccache
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ccache"
          {
            echo 'max_size = 1.5G'
            echo 'compiler_check = content'
            echo 'compression = true'
            echo 'compression_level = 6'
          } > "$HOME/.ccache/ccache.conf"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          # Prepend the ccache symlinks dir so cc/gcc resolve through ccache
          # even when OpenWrt invokes absolute compiler paths during prereq.
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"

      # The OpenWrt staging_dir/tmp tree is far larger than the 10 GB cache
      # limit, so only the toolchain download cache above is persisted.

      - name: Clone ImmortalWrt source
        run: |
          set -euo pipefail
          REF="${SOURCE_BRANCH}"
          if [ -n "${SOURCE_TAG}" ]; then
            REF="refs/tags/${SOURCE_TAG}"
          fi
          echo "Cloning ${SOURCE_REPO} at ${REF}"
          git clone --depth=1 --branch="${REF}" "${SOURCE_REPO}" "${SOURCE_DIR}"
          cd "${SOURCE_DIR}"
          echo "Checked out: $(git log -1 --format='%h %s')"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build firmware
        id: build_step
        env:
          # The CI workflow delegates the whole pipeline (overlay, patches,
          # custom feeds, .config generation, compile, artifact collection) to
          # scripts/build.sh so there is exactly one implementation.
          OPENWRT_DIR: ${{ env.SOURCE_DIR }}
          OUTPUT_DIR: ${{ env.OUTPUT_DIR }}
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          ./scripts/build.sh

      - name: Report ccache stats
        if: always()
        run: ccache --show-stats || true

      - name: Name artifact
        id: artifact
        if: always()
        run: |
          echo "name=firmware-${TARGET_ARCH}-${TARGET_SUBTARGET}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Generate SHA256 checksums
        if: always()
        run: |
          set -euo pipefail
          cd "${OUTPUT_DIR}" 2>/dev/null || exit 0
          # sha256sums.txt is written last and must not hash itself
          find . -maxdepth 1 -type f ! -name 'sha256sums.txt' ! -name '*.sha256' \
            -printf '%P\0' | sort -z | xargs -0 -r sha256sum > sha256sums.txt
          cat sha256sums.txt || true
          sha256sum -c sha256sums.txt

      - name: Record built upstream commit
        if: steps.build_step.outcome == 'success'
        run: |
          set -euo pipefail
          # Publish the build marker as an ARTIFACT instead of pushing a file
          # to main: pushing from CI races with concurrent runs and requires
          # write tokens; artifacts are atomic, per-run, and can be downloaded
          # by sync-upstream.yml via the GitHub API (see that workflow).
          mkdir -p "$RUNNER_TEMP/marker"
          printf '%s\n' "${SOURCE_COMMIT}" > "$RUNNER_TEMP/marker/.upstream-built"
      - name: Upload build marker
        if: steps.build_step.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: upstream-built-marker
          path: ${{ runner.temp }}/marker/.upstream-built
          retention-days: 90
          if-no-files-found: error
          compression-level: 0

      - name: Upload firmware artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ env.OUTPUT_DIR }}/
          retention-days: 14
          if-no-files-found: warn
          compression-level: 6

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: |
            ${{ env.SOURCE_DIR }}/logs/
            ${{ env.SOURCE_DIR }}/.config
          retention-days: 7
          if-no-files-found: ignore

  # ──────────────────────────────────────────────
  # Release (same workflow so the artifact name is known)
  # ──────────────────────────────────────────────
  release:
    name: Create Release
    needs: [prepare, build]
    if: |
      always() &&
      needs.build.result == 'success' &&
      (github.event_name == 'push' ||
       github.event_name == 'repository_dispatch' ||
       inputs.create_release == true)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-artifacts

      - name: Build tag name
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo 'v0')"
          DATE="$(date -u +%Y%m%d)"
          TAG="${VERSION}-build.${GITHUB_RUN_NUMBER}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=ImmortalWrt PVE ${TAG}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"

      - name: Collect release files
        run: |
          set -euo pipefail
          cd release-artifacts
          ls -lh
          {
            echo "# ImmortalWrt PVE build ${GITHUB_RUN_NUMBER}"
            echo ""
            echo "- Upstream: $SOURCE_REPO @ ${SOURCE_COMMIT:-unknown}"
            echo "- Source ref: ${{ needs.prepare.outputs.source_tag || needs.prepare.outputs.source_branch }}"
            echo "- Target: ${{ needs.prepare.outputs.arch }}/${{ needs.prepare.outputs.subtarget }}"
            echo "- Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "## Files"
            echo ""
            echo '```'
            sha256sum -c sha256sums.txt 2>/dev/null || cat sha256sums.txt
            echo '```'
          } > ../release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body_path: release-notes.md
          # Globs, so versioned ImmortalWrt file names are matched
          files: |
            release-artifacts/*combined*.img.gz
            release-artifacts/*rootfs*.img.gz
            release-artifacts/*rootfs*.tar.gz
            release-artifacts/*kernel.bin
            release-artifacts/*.manifest
            release-artifacts/sha256sums.txt
          fail_on_unmatched_files: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: Build Summary
    runs-on: ubuntu-24.04
    needs: [prepare, build, release]
    if: always()
    steps:
      - name: Write summary
        run: |
          {
            echo "## Build Summary"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Upstream | \`${{ needs.prepare.outputs.source_repo }}\` |"
            echo "| Ref | \`${{ needs.prepare.outputs.source_tag || needs.prepare.outputs.source_branch }}\` |"
            echo "| Target | \`${{ needs.prepare.outputs.board }}/${{ needs.prepare.outputs.subtarget }}\` |"
            echo "| Build | \`${{ needs.build.result }}\` |"
            echo "| Release | \`${{ needs.release.result }}\` |"
            echo "| Artifact | \`${{ needs.build.outputs.artifact_name }}\` |"
            echo "| Run | ${{ github.run_id }} |"
          } >> "$GITHUB_STEP_SUMMARY"