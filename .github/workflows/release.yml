name: Release

on:
  workflow_call:
    inputs:
      build_run_id:
        description: 'Build workflow run ID to download artifacts from'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean
      version_override:
        description: 'Override version tag (e.g. v25.12.0)'
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Build workflow run ID to download artifacts from'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean
      version_override:
        description: 'Override version tag (e.g. v25.12.0)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

env:
  ARTIFACT_NAME: firmware-build

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release-artifacts
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List downloaded artifacts
        run: |
          echo "## Downloaded Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lhR release-artifacts/ >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Extract version and build metadata
        id: meta
        run: |
          if [ -f release-artifacts/manifest.json ]; then
            echo "Found manifest.json, extracting metadata..."
            MANIFEST_VERSION=$(python3 -c "
              import json, sys
              with open('release-artifacts/manifest.json') as f:
                  m = json.load(f)
              print(m.get('version', ''))
            " 2>/dev/null || true)
            MANIFEST_DATE=$(python3 -c "
              import json, sys
              with open('release-artifacts/manifest.json') as f:
                  m = json.load(f)
              print(m.get('date', ''))
            " 2>/dev/null || true)
            MANIFEST_COMMIT=$(python3 -c "
              import json, sys
              with open('release-artifacts/manifest.json') as f:
                  m = json.load(f)
              print(m.get('commit', ''))
            " 2>/dev/null || true)
          fi

          # Determine version tag
          if [ -n "${{ inputs.version_override }}" ]; then
            VERSION="${{ inputs.version_override }}"
            echo "Using version override: $VERSION"
          elif [ -n "$MANIFEST_VERSION" ]; then
            VERSION="$MANIFEST_VERSION"
            echo "Using version from manifest: $VERSION"
          else
            VERSION="v0.0.0"
            echo "No version found, using fallback: $VERSION"
          fi

          # Format date for tag suffix
          if [ -n "$MANIFEST_DATE" ]; then
            TAG_DATE=$(echo "$MANIFEST_DATE" | tr -d '-' | cut -c1-8)
          else
            TAG_DATE=$(date -u +%Y%m%d)
          fi

          # Build tag: v25.12.0-20250101
          TAG="${VERSION}-${TAG_DATE}"

          # Build release name: ImmortalWrt PVE v25.12.0-20250101
          RELEASE_NAME="ImmortalWrt PVE ${VERSION}-${TAG_DATE}"

          # Short commit for changelog
          SHORT_COMMIT="${MANIFEST_COMMIT:-$(git rev-parse --short HEAD 2>/dev/null || echo unknown)}"

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "date=$TAG_DATE" >> $GITHUB_OUTPUT
          echo "commit=$SHORT_COMMIT" >> $GITHUB_OUTPUT

          echo "## Release Metadata" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`$TAG\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Name | $RELEASE_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`$SHORT_COMMIT\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-release | ${{ inputs.prerelease }} |" >> $GITHUB_STEP_SUMMARY

      - name: Check for duplicate release
        id: check_duplicate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if gh release view "$TAG" 2>/dev/null; then
            echo "duplicate=true" >> $GITHUB_OUTPUT
            echo "::error::Release $TAG already exists! Aborting to prevent duplicate."
            exit 1
          else
            echo "duplicate=false" >> $GITHUB_OUTPUT
            echo "No existing release found for tag $TAG, proceeding."
          fi

      - name: Generate changelog
        id: changelog
        run: |
          # Determine the previous release tag for changelog range
          PREV_TAG=$(git tag --sort=-creatordate | head -1 || true)

          CHANGELOG_FILE="release-artifacts/changelog.md"

          {
            echo "# Changelog"
            echo ""
            echo "**Release**: ${{ steps.meta.outputs.release_name }}"
            echo "**Date**: $(date -u +%Y-%m-%d)"
            echo "**Commit**: \`${{ steps.meta.outputs.commit }}\`"
            echo ""

            if [ -n "$PREV_TAG" ]; then
              echo "## Changes since ${PREV_TAG}"
              echo ""
              echo "### Commits"
              echo ""
              git log "${PREV_TAG}..HEAD" --pretty=format:"- [%h](https://github.com/${{ github.repository }}/commit/%H) %s (%an)" --no-merges 2>/dev/null || echo "- No commits found in range"
            else
              echo "## Initial Release"
              echo ""
              echo "### Commits"
              echo ""
              echo "- Initial release build"
            fi

            echo ""
            echo "### Build Configuration"
            echo ""
            if [ -f release-artifacts/manifest.json ]; then
              echo "\`\`\`json"
              cat release-artifacts/manifest.json
              echo ""
              echo "\`\`\`"
            else
              echo "No manifest available"
            fi

            echo ""
            echo "### Files"
            echo ""
            echo "| File | Size | SHA256 |"
            echo "|------|------|--------|"
          } > "$CHANGELOG_FILE"

          # Append file table with sizes and checksums
          for f in release-artifacts/firmware.img.gz release-artifacts/rootfs.tar.gz release-artifacts/kernel.bin; do
            if [ -f "$f" ]; then
              BASENAME=$(basename "$f")
              SIZE=$(ls -lh "$f" | awk '{print $5}')
              SHA=$(sha256sum "$f" | awk '{print $1}')
              echo "| \`$BASENAME\` | $SIZE | \`$SHA\` |" >> "$CHANGELOG_FILE"
            fi
          done

          echo "" >> "$CHANGELOG_FILE"
          echo "---" >> "$CHANGELOG_FILE"
          echo "*Generated by immortalwrt-pve-builder on $(date -u +%Y-%m-%dT%H:%M:%SZ)*" >> "$CHANGELOG_FILE"

          echo "Changelog generated successfully"
          echo "## Changelog Preview" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -30 "$CHANGELOG_FILE" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Generate SHA256 checksums
        run: |
          cd release-artifacts
          SHA256_FILE="sha256sums.txt"

          {
            echo "# SHA256 Checksums"
            echo "# Release: ${{ steps.meta.outputs.release_name }}"
            echo "# Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "#"
            echo "# Verify with: sha256sum -c sha256sums.txt"
            echo ""

            for f in firmware.img.gz rootfs.tar.gz kernel.bin; do
              if [ -f "$f" ]; then
                sha256sum "$f"
              fi
            done
          } > "$SHA256_FILE"

          echo "## SHA256 Checksums" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat "$SHA256_FILE" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Verify all release files exist
        run: |
          MISSING=0
          for f in firmware.img.gz rootfs.tar.gz kernel.bin sha256sums.txt changelog.md; do
            if [ ! -f "release-artifacts/$f" ]; then
              echo "::warning::Missing release file: $f"
              MISSING=$((MISSING + 1))
            else
              echo "Found: $f ($(ls -lh "release-artifacts/$f" | awk '{print $5}'))"
            fi
          done

          if [ -f release-artifacts/manifest.json ]; then
            echo "Found: manifest.json"
          else
            echo "::warning::Missing optional file: manifest.json"
          fi

          if [ "$MISSING" -gt 0 ]; then
            echo "::warning::$MISSING file(s) missing from release artifacts"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.release_name }}
          body_path: release-artifacts/changelog.md
          prerelease: ${{ inputs.prerelease }}
          draft: false
          fail_on_unmatched_files: true
          files: |
            release-artifacts/firmware.img.gz
            release-artifacts/rootfs.tar.gz
            release-artifacts/kernel.bin
            release-artifacts/sha256sums.txt
            release-artifacts/manifest.json
            release-artifacts/changelog.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        if: always()
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${{ steps.meta.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Name | ${{ steps.meta.outputs.release_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-release | ${{ inputs.prerelease }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ steps.meta.outputs.commit }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Uploaded Files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for f in firmware.img.gz rootfs.tar.gz kernel.bin sha256sums.txt manifest.json changelog.md; do
            if [ -f "release-artifacts/$f" ]; then
              SIZE=$(ls -lh "release-artifacts/$f" | awk '{print $5}')
              echo "- \`${f}\` (${SIZE})" >> $GITHUB_STEP_SUMMARY
            fi
          done
