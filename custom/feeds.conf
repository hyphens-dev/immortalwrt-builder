# ImmortalWrt PVE Builder — 附加 feeds
# ---------------------------------------------------------------------------
# 注意：这里只写"额外"的 feed，不要把上游默认的 packages/luci/routing/
# telephony/video 抄一遍。
#
# scripts/build.sh 是把它 **追加** 到源码树的 feeds.conf.default 末尾，
# 而不是覆盖。原因：上游 feeds.conf.default 在 24.10 用分支、在 25.12 改用
# 固定 commit（src-git packages <url>^<sha>），而且 25.12 还多了 video feed。
# 一旦用本文件整体覆盖，就会把 24.10 的 feed 塞进 25.12 的源码树，
# 造成 luci/packages 与内核版本不匹配的诡异失败。
#
# 每行格式与上游一致：src-git <名字> <url>[;<分支>|^<commit>]
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# nikki / mihomo（旁路由代理）。mihomo 不在官方 feeds 里；
# 取消下面一行以提供 mihomo + luci-app-nikki，
# 并把 config.yml 的 features.proxy.nikki 置为 true。
# 分支需与所选上游版本匹配（25.12 用 master，24.10 用 openwrt-24.10）。
# ---------------------------------------------------------------------------
# src-git nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git;main