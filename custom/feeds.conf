# ImmortalWrt PVE Builder — feeds 配置
# 基于 openwrt-24.10 默认 feeds，并预留 nikki(mihomo) 附加 feed。
# build.sh 会将其复制为源码树的 feeds.conf.default。

src-git packages https://github.com/immortalwrt/packages.git;openwrt-24.10
src-git luci https://github.com/immortalwrt/luci.git;openwrt-24.10
src-git routing https://git.openwrt.org/feed/routing.git;openwrt-24.10
src-git telephony https://git.openwrt.org/feed/telephony.git;openwrt-24.10

# ---------------------------------------------------------------------------
# nikki / mihomo（旁路由代理）。mihomo 不在官方 24.10 feeds 中；
# 取消注释下面任意一行以引入提供 luci-app-nikki + mihomo 的 feed，
# 并把 config.yml 的 features.proxy.nikki 置为 true。
# 常见选择（版本分支需与 openwrt-24.10 兼容，自行验证）：
# src-git nikki https://github.com/jerrykuku/luci-app-nikki.git;main
# src-git mihomo_feed https://github.com/immortalwrt/packages.git;master
# ---------------------------------------------------------------------------
