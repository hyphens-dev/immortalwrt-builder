# PVE/KVM guest TCP & 网络栈调优
# 配合 kmod-tcp-bbr / fq_codel / cake 使用（见 config.yml features.performance）

# --- TCP 拥塞控制：BBR + fq 派发 ---
net.ipv4.tcp_congestion_control=bbr
net.core.default_qdisc=fq
net.ipv4.tcp_notsent_lowaddr=16384
net.ipv4.tcp_window_scaling=1
net.ipv4.tcp_mtu_probing=1
net.ipv4.tcp_fastopen=3
net.ipv4.tcp_sack=1
net.ipv4.tcp_rmem=4096 131072 26214400
net.ipv4.tcp_wmem=4096 131072 26214400
net.core.rmem_max=26214400
net.core.wmem_max=26214400
net.core.netdev_max_backlog=8192
net.ipv4.tcp_max_syn_backlog=8192
net.core.somaxconn=4096

# --- 虚拟设备队列（virtio-net 多队列场景）---
net.core.dev_weight=64
net.core.busy_poll=50
net.core.busy_read=50

# --- conntrack（防火墙 nftables 后端）---
net.netfilter.nf_conntrack_max=131072
net.netfilter.nf_conntrack_tcp_timeout_established=3600
net.netfilter.nf_conntrack_tcp_timeout_time_wait=30

# --- 关闭 bridge 上的 netfilter 之外的无用项 ---
net.ipv4.conf.all.forwarding=1
net.ipv4.ip_forward=1
net.ipv4.conf.all.rp_filter=1
net.ipv4.icmp_ratelimit=100

# --- VM 内存行为（balloon 友好）---
vm.swappiness=10
vm.dirty_ratio=15
vm.dirty_background_ratio=5
